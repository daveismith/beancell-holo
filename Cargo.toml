[package]
edition      = "2024"
name         = "beancell-holo"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "beancell-holo"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1", features = ["defmt", "esp32c3", "unstable"] }
esp-sync = { version = "0.2.1", features = ["esp32c3"] }

esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
] }

defmt                  = "1.1.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c3"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "icmp",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.10.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5.0", features = ["defmt"] }
esp-radio = { version = "0.18.0", features = [
  "defmt",
  "esp-alloc",
  "esp32c3",
  "unstable",
  "wifi"
] }
smoltcp = { version = "0.13.1", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
async-trait      = { version = "0.1.89", default-features = false }
heapless         = "0.9.3"
portable-atomic  = { version = "1.11.1", default-features = false }
libm             = "0.2.10"
esp-storage      = { version = "0.9.0", features = ["esp32c3"] }
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
sequential-storage = "7.2.0"
# TODO: Add esp-idf-svc when dependency conflicts are resolved
# esp-idf-svc      = { version = "0.49.0", features = ["alloc"] }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[patch.crates-io]
esp-wifi-sys-esp32c3 = { git = "https://github.com/daveismith/esp-wifi-sys.git" , branch = "wpa3-personal", package = "esp-wifi-sys-esp32c3" }

# Override ALL crates coming from the esp-hal monorepo workspace to resolve the native links conflict
esp-alloc = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-alloc" }
esp-hal = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-hal" }
esp-radio = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-radio" }
esp-rtos = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-rtos" }
esp-rom-sys = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-rom-sys" }
esp-riscv-rt = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-riscv-rt" }
esp-hal-procmacros = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-hal-procmacros" }
esp-config = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-config" }
esp-metadata-generated = { git = "https://github.com/daveismith/esp-hal.git", branch = "wpa3-personal", package = "esp-metadata-generated" }
